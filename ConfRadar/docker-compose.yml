services:
  confradar.api:
    build:
      context: .
      dockerfile: ConfRadar.Api/Dockerfile
    ports:
      - "8080:5000"
    environment:
      - DOTNET_URLS=${DOTNET_URLS}
      
    networks:
      - confradar-network

  confradar.postgres:
    image: postgres:17
    networks:
      - confradar-network
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}        
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}    
    ports:
      - "5433:5432"
    volumes:
      - confradar_data:/var/lib/postgresql/data 

  confradar.minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    networks:
      - confradar-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  confradar.redis:
    image: redis:8.2.2
    networks:
      - confradar-network
    ports:
      - "6379:6379"
    volumes:
      - confradar-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass","${REDIS_PASSWORD}"]



volumes:
  confradar_data:
  minio_data:
  confradar-redis-data:


networks:
  confradar-network:
    name: confradar-network