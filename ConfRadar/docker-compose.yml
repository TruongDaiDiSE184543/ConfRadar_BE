services:
  confradar.api:
    build:
      context: .
      dockerfile: ConfRadar.Api/Dockerfile
    ports:
      - "8080:5000"
    environment:
      - DOTNET_URLS=http://+:5000 
    networks:
      - confradar-network

  confradar.postgres:
    image: postgres:17
    networks:
      - confradar-network
    restart: always
    environment:
      POSTGRES_USER: confradar123        
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: confradar_db    
    ports:
      - "5433:5432"
    volumes:
      - confradar_data:/var/lib/postgresql/data 

  confradar.minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    networks:
      - confradar-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: confradar123
      MINIO_ROOT_PASSWORD: confradar123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


volumes:
  confradar_data:
  minio_data:


networks:
  confradar-network:
    name: confradar-network